<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exercise Plan</title>
<meta name="theme-color" content="#06090D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Exercise Plan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: HUD console. Fixed 6-up tab grid, chamfered panels on a faint blueprint grid, mono readouts. Deliberately dark-only. */
:root{
  --bg:#06090D; --grid:rgba(59,232,255,.045); --surface:#0B1219; --surface-2:#0F1922; --line:#1A2A36;
  --ink:#DDF4FF; --muted:#6B8595; --accent:#3BE8FF; --accent-dim:rgba(59,232,255,.14);
  --done:#5CFFA8; --done-dim:rgba(92,255,168,.09); --warn:#FFB547;
  --display:"Chakra Petch","Rajdhani","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --cut:12px;
  --chamfer:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)));
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{min-height:100vh;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font-family:var(--display);font-size:16px;line-height:1.4;padding-inline:16px;padding-block:0 48px;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.label{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.label b{color:var(--accent);font-weight:500}

/* chamfered panel with a 1px edge that follows the cut */
.hud{--hud-line:var(--line);--hud-bg:var(--surface);position:relative;background:var(--hud-line);clip-path:var(--chamfer);isolation:isolate}
.hud::before{content:"";position:absolute;inset:1px;background:var(--hud-bg);clip-path:var(--chamfer);z-index:-1}

/* tab strip: always fits, never scrolls */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(6,9,13,.92);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);margin-inline:-16px;padding:0 16px;border-bottom:1px solid var(--line)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr) 1.2fr 1.6fr;gap:5px;padding:10px 0}
.tab{--cut:7px;min-width:0;height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tab.hud{--hud-bg:var(--surface)}
.tab[aria-selected="true"]{color:var(--bg);--hud-line:var(--accent);--hud-bg:var(--accent)}
.tab .bar{width:62%;height:2px;background:var(--line);overflow:hidden}
.tab .bar i{display:block;height:100%;background:var(--accent)}
.tab .bar.full i{background:var(--done)}
.tab[aria-selected="true"] .bar{background:rgba(6,9,13,.25)}
.tab[aria-selected="true"] .bar i{background:var(--bg)}

/* day header */
.dayhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:22px 0 14px}
.dayhead > div{min-width:0}
h1{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;margin:8px 0 0;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.left{flex:0 0 auto;text-align:right}
.left .v{font-family:var(--mono);font-weight:700;font-size:44px;line-height:.9;color:var(--warn);text-shadow:0 0 18px rgba(255,181,71,.35)}
.left.ok .v{color:var(--done);text-shadow:0 0 18px rgba(92,255,168,.35)}
.left .label{margin-top:6px}

/* segmented progress: one cell per item */
.segbar{display:flex;gap:4px}
.segbar i{flex:1;height:6px;background:var(--line);transform:skewX(-20deg)}
.segbar i.on{background:var(--accent);box-shadow:0 0 8px rgba(59,232,255,.5)}
.segbar.full i.on{background:var(--done);box-shadow:0 0 8px rgba(92,255,168,.45)}

/* checklist */
.list{display:grid;gap:8px;margin-top:18px}
.item{display:flex;align-items:center;gap:14px;width:100%;min-height:66px;padding:12px 16px 12px 14px}
.item .idx{flex:0 0 auto;font-family:var(--mono);font-size:12px;color:var(--muted);width:20px}
.item .name{flex:1;min-width:0;font-weight:600;font-size:19px;line-height:1.2;text-decoration-thickness:2px;text-decoration-color:var(--done)}
.box{flex:0 0 auto;width:30px;height:30px;border:1.5px solid var(--muted);display:grid;place-items:center;transform:rotate(45deg) scale(.82);transition:background .15s,border-color .15s,box-shadow .15s}
.box svg{width:20px;height:20px;transform:rotate(-45deg);stroke:transparent;stroke-width:3.2;fill:none}
.item.done{--hud-line:rgba(92,255,168,.35);--hud-bg:#0A1A14}
.item.done .idx{color:var(--done)}
.item.done .name{text-decoration-line:line-through;color:var(--muted);font-weight:500}
.item.done .box{background:var(--done);border-color:var(--done);box-shadow:0 0 12px rgba(92,255,168,.55)}
.item.done .box svg{stroke:var(--bg)}
.foot{display:flex;justify-content:flex-end;margin-top:16px}
.ghost{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 14px;border:1px solid var(--line)}
.ghost.armed{color:var(--warn);border-color:var(--warn)}
.alldone{margin-top:16px;padding:14px;text-align:center;font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--done);--hud-line:rgba(92,255,168,.45);--hud-bg:#0A1A14}

/* summary */
.hero{margin-top:20px;padding:18px;display:grid;gap:16px;--hud-line:rgba(59,232,255,.35)}
.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big b{font-family:var(--mono);font-weight:700;font-size:56px;line-height:.9;color:var(--accent);text-shadow:0 0 22px rgba(59,232,255,.35)}
.big span{font-family:var(--mono);font-size:14px;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:8px}
.col{display:grid;gap:6px;text-align:center}
.col i{display:block;height:44px;background:var(--line);position:relative;overflow:hidden}
.col i u{position:absolute;inset:auto 0 0 0;background:var(--accent);box-shadow:0 0 10px rgba(59,232,255,.5)}
.col i u.full{background:var(--done);box-shadow:0 0 10px rgba(92,255,168,.5)}
.col small{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.stat{padding:14px;min-width:0}
.stat .v{font-family:var(--mono);font-weight:700;font-size:32px;line-height:1;margin-top:8px}
.stat .v small{font-size:13px;font-weight:400;color:var(--muted);margin-left:4px}
h2{font-family:var(--mono);font-weight:500;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}

/* push-ups */
.push{display:grid;gap:12px;margin-top:8px;padding:16px}
.push .big b{font-size:46px}
.meter{display:block;height:8px;background:var(--line);position:relative;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);box-shadow:0 0 10px rgba(59,232,255,.55);transition:width .25s}
.meter::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 1px),var(--bg) calc(25% - 1px) 25%)}
.push.full .big b{color:var(--done)}
.push.full .meter i{background:var(--done)}
.pace{font-family:var(--mono);font-size:12px;color:var(--muted);line-height:1.5}
.custom{display:flex;gap:8px}
.custom input{flex:1;min-width:0;padding:12px;border:1px solid var(--line);background:var(--bg);font-family:var(--mono);font-size:16px}
.custom input::placeholder{color:var(--muted)}
.btn{--cut:8px;padding:12px 18px;font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;background:var(--accent);color:var(--bg);clip-path:var(--chamfer)}
.undo{justify-self:start}

.days{display:grid;gap:6px}
.drow{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:start;padding:12px 14px;--cut:9px}
.drow .tag{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--accent);line-height:1.6}
.drow .g{min-width:0;display:grid;gap:7px}
.drow .g b{font-weight:600;font-size:16px}
.drow .segbar i{height:4px}
.drow .todo{font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.5}
.drow .c{font-family:var(--mono);font-size:13px;color:var(--muted);line-height:1.8}
.drow .c.ok{color:var(--done);font-weight:700}
.reset{display:grid;gap:10px;margin-top:28px;padding-top:18px;border-top:1px dashed var(--line)}
.reset .ghost{justify-self:start;color:var(--warn);border-color:rgba(255,181,71,.4)}
.reset .ghost.armed{background:rgba(255,181,71,.12);border-color:var(--warn)}

/* LISS */
.qbtn{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:16px;--hud-line:rgba(59,232,255,.35)}
.qbtn .t{font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.04em}
.plus{--cut:8px;flex:0 0 auto;width:46px;height:46px;background:var(--accent);color:var(--bg);display:grid;place-items:center;font-family:var(--mono);font-size:26px;font-weight:700;line-height:1;clip-path:var(--chamfer);box-shadow:0 0 14px rgba(59,232,255,.4)}
.log{display:grid;gap:6px}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 14px;--cut:8px}
.lrow .when{font-family:var(--mono);font-size:12px;color:var(--muted);width:96px;flex:0 0 auto}
.lrow .what{flex:1;font-weight:600;min-width:0}
.x{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 9px;border:1px solid var(--line)}
.empty{padding:16px 14px;color:var(--muted);font-family:var(--mono);font-size:12px;line-height:1.6;border:1px dashed var(--line)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

</head>
<body>
<header class="top"><nav class="tabs" id="tabs" role="tablist"></nav></header>
<main id="main"></main>

<script>
/* The plan. Edit here to change exercises. */
const PLAN = [
  {id:'d1',label:'Day 1',short:'D1',group:'Back + Triceps',items:['Pull Ups','Seated Cable Row','Skull Crushers','Triceps Pull Down']},
  {id:'d2',label:'Day 2',short:'D2',group:'Chest + Shoulders',items:['Shoulder Press','Flat Bench Press','Dumbbell Lateral Raise','Cable Fly','Front Plate Raise']},
  {id:'d3',label:'Day 3',short:'D3',group:'Back + Biceps',items:['Pull Ups','Seated Cable Row','Barbell Curl','Bicep Curl','Goblet Squat','Bent Over Row']},
  {id:'d4',label:'Day 4',short:'D4',group:'Chest + Shoulders',items:['Bench Press','Shoulder Press','Dumbbell Fly','Pec Fly','Dips','Barbell Curl','Hammer Curl']}
].map(d => ({...d, items:d.items.map(n => ({id:n.toLowerCase().replace(/[^a-z0-9]+/g,'-'), name:n}))}));
const LISS_MIN = 35;
const PUSH_GOAL = 2000;
const KEY = 'gymcheck.v3';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => n.toLocaleString('en-SG');
const pad = n => String(n).padStart(2,'0');
const fresh = tab => ({done:{}, cardio:[], push:[], tab: tab || 'd1', planVer: 2});

let state = null;
try { state = JSON.parse(localStorage.getItem(KEY)); } catch(e) {}
if (!state || typeof state.done !== 'object') state = fresh();
state.cardio = state.cardio || []; state.push = state.push || [];
const PLAN_VER = 2;
if (state.planVer !== PLAN_VER) { state.done = {}; state.planVer = PLAN_VER; if (!PLAN.some(d => d.id === state.tab) && state.tab !== 'cardio' && state.tab !== 'summary') state.tab = 'd1'; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} };
let armed = null, armTimer = null;

const ymd = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const dayById = id => PLAN.find(d => d.id === id);
const isDone = (d,x) => !!state.done[d+'/'+x];
function dayStats(day){ const left = day.items.filter(it => !isDone(day.id,it.id)); const total = day.items.length; return {done: total-left.length, total, left, pct: total ? (total-left.length)/total : 0}; }
const lissSets = () => state.cardio.length;
const pushTotal = () => state.push.reduce((s,n) => s + n, 0);
const tick = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const segbar = (day, s) => `<span class="segbar ${s.pct===1?'full':''}">${day.items.map(it => `<i class="${isDone(day.id,it.id)?'on':''}"></i>`).join('')}</span>`;

function arm(key){ clearTimeout(armTimer); if (armed === key) return true; armed = key; render(); armTimer = setTimeout(() => { armed = null; render(); }, 3000); return false; }

function render(){
  renderTabs();
  const t = state.tab;
  $('#main').innerHTML = t==='summary' ? renderSummary() : t==='cardio' ? renderCardio() : renderDay(dayById(t) || PLAN[0]);
}

function renderTabs(){
  const tabs = [...PLAN, {id:'cardio',short:'LISS'}, {id:'summary',short:'Summary'}];
  $('#tabs').innerHTML = tabs.map(t => {
    let p = 0;
    if (t.items) p = dayStats(t).pct;
    else if (t.id==='summary') p = Math.min(1, pushTotal()/PUSH_GOAL);
    else p = state.cardio.length ? 1 : 0;
    return `<button class="tab hud" role="tab" aria-selected="${state.tab===t.id}" data-act="tab" data-tab="${t.id}">${esc(t.short)}<span class="bar ${p===1?'full':''}"><i style="width:${p*100}%"></i></span></button>`;
  }).join('');
}

function renderDay(day){
  const s = dayStats(day), ok = s.left.length === 0;
  return `<div class="dayhead"><div><div class="label num">// ${day.label} &middot; <b>${s.done}/${s.total}</b> exercises</div><h1>${esc(day.group)}</h1></div>
      <div class="left ${ok?'ok':''}"><div class="v num">${ok ? '&#10003;' : pad(s.left.length)}</div><div class="label">${ok ? 'Clear' : 'Left'}</div></div></div>
    ${segbar(day, s)}
    <div class="list">${day.items.map((it, i) => {
      const d = isDone(day.id,it.id);
      return `<button class="item hud ${d?'done':''}" role="checkbox" aria-checked="${d}" data-act="toggle" data-day="${day.id}" data-ex="${it.id}"><span class="idx num">${pad(i+1)}</span><span class="name">${esc(it.name)}</span><span class="box">${tick}</span></button>`;
    }).join('')}</div>
    ${ok ? `<div class="alldone hud">${esc(day.group)} complete</div>` : ''}
    <div class="foot"><button class="ghost ${armed===day.id?'armed':''}" data-act="untick" data-day="${day.id}">${armed===day.id?'Tap again to untick all':'Untick all'}</button></div>`;
}

function renderPush(){
  const total = pushTotal(), p = Math.min(1, total/PUSH_GOAL), left = Math.max(0, PUSH_GOAL-total);
  const daysLeft = 7 - (new Date().getDay()+6)%7;
  const pace = left === 0 ? 'Goal hit for this week.' : `${fmt(left)} to go &middot; about ${fmt(Math.ceil(left/daysLeft))} a day to finish by Sunday`;
  return `<section class="hud push ${p===1?'full':''}">
      <div><div class="label">Push-ups this week</div>
      <div class="big num" style="margin-top:8px"><b>${fmt(total)}</b><span>/ ${fmt(PUSH_GOAL)}</span></div></div>
      <span class="meter"><i style="width:${p*100}%"></i></span>
      <div class="pace num">${pace}</div>
      <div class="custom"><input id="p-n" type="number" inputmode="numeric" min="1" placeholder="Number of push-ups" aria-label="Push-ups to add"><button class="btn" data-act="pushc">Add</button></div>
      ${state.push.length ? `<button class="ghost undo num" data-act="pundo">Undo last (+${state.push[state.push.length-1]})</button>` : ''}
    </section>`;
}

function renderSummary(){
  let full = 0, exDone = 0, exTotal = 0;
  PLAN.forEach(d => { const s = dayStats(d); exDone += s.done; exTotal += s.total; if (s.pct===1) full++; });
  const cols = PLAN.map(d => { const s = dayStats(d); return `<div class="col"><i><u class="${s.pct===1?'full':''}" style="height:${s.pct*100}%"></u></i><small>${d.short}</small></div>`; }).join('');
  const rows = PLAN.map(d => {
    const s = dayStats(d), ok = s.pct===1;
    const todo = ok ? '' : s.done===0 ? `<span class="todo">Not started</span>` : `<span class="todo">Left: ${s.left.map(i => esc(i.name)).join(', ')}</span>`;
    return `<button class="drow hud" data-act="tab" data-tab="${d.id}"><span class="tag">${d.short}</span>
      <span class="g"><b>${esc(d.group)}</b>${segbar(d, s)}${todo}</span>
      <span class="c num ${ok?'ok':''}">${ok?'Done':s.done+'/'+s.total}</span></button>`;
  }).join('');
  return `<section class="hud hero">
      <div><div class="label">Workouts completed</div>
      <div class="big num" style="margin-top:8px"><b>${full}/${PLAN.length}</b><span>this week</span></div></div>
      <div class="cols" style="--n:${PLAN.length}">${cols}</div>
    </section>
    <div class="stats">
      <div class="hud stat"><div class="label">Exercises done</div><div class="v num">${exDone}<small>of ${exTotal}</small></div></div>
      <div class="hud stat"><div class="label">LISS sets</div><div class="v num">${lissSets()}</div></div>
    </div>
    ${renderPush()}
    <h2>By day</h2><div class="days">${rows}</div>
    <div class="reset">
      <div class="label">Starting a new week clears all ticks, LISS sets and push-ups.</div>
      <button class="ghost ${armed==='week'?'armed':''}" data-act="newweek">${armed==='week'?'Tap again to clear everything':'Start new week'}</button>
    </div>`;
}

function renderCardio(){
  const list = [...state.cardio].reverse().map(c =>
    `<div class="lrow hud"><span class="when">${parse(c.date).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}</span>
     <span class="what">LISS set</span><button class="x" data-act="delc" data-id="${c.id}">Remove</button></div>`).join('');
  const n = lissSets();
  return `<div class="dayhead"><div><div class="label">// Cardio</div><h1>LISS</h1></div>
      <div class="left ${n?'ok':''}"><div class="v num">${pad(n)}</div><div class="label">Sets</div></div></div>
    <button class="qbtn hud" data-act="liss"><span class="t">Log 1 set</span><span class="plus" aria-hidden="true">+</span></button>
    <h2>This week</h2>
    <div class="log">${list || '<div class="empty">No LISS sets yet. Tap the button above after each set.</div>'}</div>`;
}

function addLiss(){ state.cardio.push({id:Date.now().toString(36), type:'LISS', min:LISS_MIN, date: ymd(new Date())}); save(); render(); }
function addPush(n){ n = Math.round(n); if (!(n > 0)) return; state.push.push(n); save(); render(); }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const {act, day, ex} = b.dataset;
  if (act==='tab'){ state.tab = b.dataset.tab; save(); render(); window.scrollTo(0,0); }
  else if (act==='toggle'){ const k = day+'/'+ex; if (state.done[k]) delete state.done[k]; else state.done[k] = true; save(); render(); }
  else if (act==='untick'){ if (arm(day)) { Object.keys(state.done).forEach(k => { if (k.startsWith(day+'/')) delete state.done[k]; }); armed = null; save(); render(); } }
  else if (act==='newweek'){ if (arm('week')) { state = fresh('d1'); armed = null; save(); render(); window.scrollTo(0,0); } }
  else if (act==='pushc') addPush(parseInt($('#p-n').value));
  else if (act==='pundo'){ state.push.pop(); save(); render(); }
  else if (act==='liss') addLiss();
  else if (act==='delc'){ state.cardio = state.cardio.filter(c => c.id !== b.dataset.id); save(); render(); }
});
document.addEventListener('keydown', e => { if (e.key==='Enter' && e.target.id==='p-n') addPush(parseInt(e.target.value)); });
render();
</script>
